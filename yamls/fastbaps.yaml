name: bactolomew-fastbaps
channels:
  - conda-forge
  - bioconda
# FastBAPS 1.0.8 and genie 1.0.7 (with genieclust 1.2.0 and quitefastmst 0.9.2, the
# versions of the linux-64 conda builds) are built from source (x-bactolomew r_source, the
# same tarballs on every platform, checked by sha256, installed in this order; each lists
# a CRAN mirror or a second GitHub URL as a fallback): bioconda's r-fastbaps 1.0.8, r-genie
# and r-genieclust are linux-64 only. FastBAPS is the default population structure method,
# so the env is required: a failed download or build fails the image build. The rest of fastbaps's
# DESCRIPTION Imports come from conda; R's conda compilers build the packages.
dependencies:
  - r-base=4.4.3
  - r-rcpp
  - r-rcpparmadillo
  - r-matrix
  - r-phangorn
  - r-ape
  - r-phytools
  - r-irlba
  - r-fastcluster
  - r-gplots
  - r-optparse
  - zlib  # headers for building fastbaps

x-bactolomew:
  r_source:
    - name: quitefastmst
      version: 0.9.2
      sha256: fd1fe6bb60f04a2ac21a0d895fc5546cb8bb4d053ba33c97d2dbace536ea079f
      urls:
        - https://cran.r-project.org/src/contrib/quitefastmst_0.9.2.tar.gz
        - https://cran.r-project.org/src/contrib/Archive/quitefastmst/quitefastmst_0.9.2.tar.gz
        - https://cloud.r-project.org/src/contrib/quitefastmst_0.9.2.tar.gz
        - https://cloud.r-project.org/src/contrib/Archive/quitefastmst/quitefastmst_0.9.2.tar.gz
    - name: genieclust
      version: 1.2.0
      sha256: b26eaba336aa331d03b18b2b949b975c753204733cf0b7dbc72df14a30fb65ce
      urls:
        - https://cran.r-project.org/src/contrib/Archive/genieclust/genieclust_1.2.0.tar.gz
        - https://cloud.r-project.org/src/contrib/Archive/genieclust/genieclust_1.2.0.tar.gz
    - name: genie
      version: 1.0.7
      sha256: dc1038fc69c961adc28c5c2174e561908ac1f884f2370b480395517ba736c3d9
      urls:
        - https://cran.r-project.org/src/contrib/genie_1.0.7.tar.gz
        - https://cran.r-project.org/src/contrib/Archive/genie/genie_1.0.7.tar.gz
        - https://cloud.r-project.org/src/contrib/genie_1.0.7.tar.gz
        - https://cloud.r-project.org/src/contrib/Archive/genie/genie_1.0.7.tar.gz
    - name: fastbaps
      version: 1.0.8
      sha256: d99ddc232acce92556d4592d54add63db0dcc1d73f3e3c291af3b6ee292159bc
      urls:
        - https://github.com/gtonkinhill/fastbaps/archive/refs/tags/v1.0.8.tar.gz
        - https://codeload.github.com/gtonkinhill/fastbaps/tar.gz/refs/tags/v1.0.8
